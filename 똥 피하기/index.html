<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💩 똥 피하기 게임</title>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Black Han Sans', 'Segoe UI', sans-serif;
            background: #0a0a0f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        #game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 600px;
            padding: 15px 25px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .score-display {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .score-display span {
            color: #ffd700;
            font-size: 28px;
        }

        #canvas {
            border-radius: 20px;
            box-shadow:
                0 0 50px rgba(102, 126, 234, 0.4),
                0 20px 60px rgba(0, 0, 0, 0.5);
            border: 3px solid rgba(255, 255, 255, 0.1);
            cursor: none;
        }

        /* ===== 화려한 오프닝 스크린 ===== */
        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            background: radial-gradient(ellipse at center, #1a0a2e 0%, #0a0a0f 70%);
            overflow: hidden;
        }

        /* 파티클 캔버스 */
        #particle-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* 네온 그리드 배경 */
        .neon-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                linear-gradient(90deg, rgba(255, 0, 128, 0.03) 1px, transparent 1px),
                linear-gradient(rgba(255, 0, 128, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
            perspective: 500px;
            transform: rotateX(60deg);
            transform-origin: center 120%;
        }

        @keyframes gridMove {
            0% {
                background-position: 0 0;
            }

            100% {
                background-position: 50px 50px;
            }
        }

        /* 타이틀 영역 */
        .title-container {
            position: relative;
            z-index: 10;
            text-align: center;
            margin-bottom: 40px;
        }

        /* 떨어지는 똥 이모지 */
        .falling-poop {
            position: absolute;
            font-size: 60px;
            animation: fallDown 3s ease-in infinite;
            filter: drop-shadow(0 0 20px rgba(139, 69, 19, 0.8));
        }

        @keyframes fallDown {
            0% {
                transform: translateY(-100px) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* 메인 타이틀 */
        .main-title {
            font-size: 100px;
            margin-bottom: 20px;
            animation: floatPoop 2s ease-in-out infinite;
            filter: drop-shadow(0 0 30px rgba(139, 69, 19, 0.8)) drop-shadow(0 0 60px rgba(139, 69, 19, 0.5));
        }

        @keyframes floatPoop {

            0%,
            100% {
                transform: translateY(0) scale(1);
            }

            50% {
                transform: translateY(-20px) scale(1.1);
            }
        }

        .game-title {
            font-size: 72px;
            font-weight: 900;
            letter-spacing: 8px;
            margin-bottom: 20px;
            position: relative;
            color: transparent;
            background: linear-gradient(180deg, #fff 0%, #ff00ff 50%, #00ffff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            animation: titleGlow 2s ease-in-out infinite alternate;
            text-shadow: none;
        }

        .game-title::before {
            content: '똥 피하기';
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #ff00ff 0%, #00ffff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: blur(20px);
            animation: glowPulse 2s ease-in-out infinite alternate;
        }

        @keyframes titleGlow {
            0% {
                filter: brightness(1);
            }

            100% {
                filter: brightness(1.3);
            }
        }

        @keyframes glowPulse {
            0% {
                opacity: 0.5;
                transform: scale(1);
            }

            100% {
                opacity: 1;
                transform: scale(1.02);
            }
        }

        .subtitle {
            font-size: 24px;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 10px;
            text-transform: uppercase;
            animation: subtitleFade 3s ease-in-out infinite;
        }

        @keyframes subtitleFade {

            0%,
            100% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }
        }

        /* 안내 카드 */
        .info-cards {
            display: flex;
            gap: 25px;
            margin: 40px 0;
            z-index: 10;
        }

        .info-card {
            padding: 25px 30px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            text-align: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .info-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(transparent,
                    rgba(255, 0, 255, 0.1),
                    transparent 30%);
            animation: rotateBorder 4s linear infinite;
        }

        .info-card::after {
            content: '';
            position: absolute;
            inset: 2px;
            background: rgba(10, 10, 15, 0.9);
            border-radius: 18px;
            z-index: -1;
        }

        @keyframes rotateBorder {
            100% {
                transform: rotate(360deg);
            }
        }

        .info-card:hover {
            transform: translateY(-10px) scale(1.05);
            border-color: rgba(255, 0, 255, 0.5);
            box-shadow:
                0 20px 40px rgba(255, 0, 255, 0.2),
                0 0 30px rgba(0, 255, 255, 0.1);
        }

        .info-card .icon {
            font-size: 50px;
            margin-bottom: 15px;
            display: block;
            animation: iconBounce 2s ease-in-out infinite;
        }

        .info-card:nth-child(2) .icon {
            animation-delay: 0.3s;
        }

        .info-card:nth-child(3) .icon {
            animation-delay: 0.6s;
        }

        @keyframes iconBounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        .info-card .label {
            font-size: 16px;
            color: #aaa;
            margin-bottom: 5px;
        }

        .info-card .value {
            font-size: 20px;
            font-weight: bold;
            background: linear-gradient(90deg, #ff00ff, #00ffff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* 시작 버튼 */
        .start-btn {
            position: relative;
            padding: 25px 80px;
            font-size: 28px;
            font-family: 'Black Han Sans', sans-serif;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #ff0080 0%, #7928ca 50%, #00d4ff 100%);
            background-size: 200% 200%;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            z-index: 10;
            letter-spacing: 5px;
            text-transform: uppercase;
            animation: gradientShift 3s ease infinite, pulse 2s ease-in-out infinite;
            box-shadow:
                0 0 30px rgba(255, 0, 128, 0.5),
                0 0 60px rgba(121, 40, 202, 0.3),
                0 0 90px rgba(0, 212, 255, 0.2);
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .start-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg,
                    transparent,
                    rgba(255, 255, 255, 0.4),
                    transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            100% {
                left: 100%;
            }
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        .start-btn:hover {
            transform: scale(1.1);
            box-shadow:
                0 0 50px rgba(255, 0, 128, 0.8),
                0 0 100px rgba(121, 40, 202, 0.5),
                0 0 150px rgba(0, 212, 255, 0.3);
        }

        .start-btn:active {
            transform: scale(0.98);
        }

        /* 스파클 효과 */
        .sparkle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            animation: sparkle 1.5s ease-in-out infinite;
        }

        @keyframes sparkle {

            0%,
            100% {
                opacity: 0;
                transform: scale(0);
            }

            50% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* ===== 게임 오버 스크린 ===== */
        #game-over-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            z-index: 100;
            padding: 50px 70px;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            border: 2px solid rgba(255, 0, 128, 0.3);
            box-shadow:
                0 0 50px rgba(255, 0, 128, 0.3),
                0 20px 60px rgba(0, 0, 0, 0.5);
            display: none;
        }

        #game-over-screen h1 {
            font-size: 48px;
            margin-bottom: 10px;
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-10px);
            }

            75% {
                transform: translateX(10px);
            }
        }

        #game-over-screen h2 {
            font-size: 28px;
            color: #ff6b6b;
            margin-bottom: 30px;
        }

        #game-over-screen p {
            font-size: 18px;
            color: #888;
        }

        #final-score {
            font-size: 80px;
            font-weight: bold;
            background: linear-gradient(180deg, #ffd700, #ff8c00);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.5));
            margin: 20px 0;
        }

        .restart-btn {
            padding: 20px 60px;
            font-size: 24px;
            font-family: 'Black Han Sans', sans-serif;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            letter-spacing: 3px;
        }

        .restart-btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>
    <div id="game-container">
        <div id="game-header">
            <div class="score-display">점수: <span id="score">0</span></div>
            <div class="score-display">최고: <span id="high-score">0</span></div>
        </div>
        <canvas id="canvas" width="600" height="700"></canvas>

        <!-- 화려한 오프닝 스크린 -->
        <div id="start-screen">
            <canvas id="particle-canvas"></canvas>
            <div class="neon-grid"></div>

            <!-- 떨어지는 똥들 -->
            <div class="falling-poop" style="left: 10%; animation-delay: 0s;">💩</div>
            <div class="falling-poop" style="left: 25%; animation-delay: 0.5s;">💩</div>
            <div class="falling-poop" style="left: 40%; animation-delay: 1s;">💩</div>
            <div class="falling-poop" style="left: 55%; animation-delay: 1.5s;">💩</div>
            <div class="falling-poop" style="left: 70%; animation-delay: 2s;">💩</div>
            <div class="falling-poop" style="left: 85%; animation-delay: 2.5s;">💩</div>

            <div class="title-container">
                <div class="main-title">💩</div>
                <h1 class="game-title">똥 피하기</h1>
                <p class="subtitle">Dodge The Poop</p>
            </div>

            <div class="info-cards">
                <div class="info-card">
                    <span class="icon">🖱️</span>
                    <div class="label">조작</div>
                    <div class="value">마우스 좌우</div>
                </div>
                <div class="info-card">
                    <span class="icon">💩</span>
                    <div class="label">미션</div>
                    <div class="value">똥을 피해라</div>
                </div>
                <div class="info-card">
                    <span class="icon">🏆</span>
                    <div class="label">목표</div>
                    <div class="value">최고 점수</div>
                </div>
            </div>

            <button class="start-btn" id="start-btn">▶ 게임 시작</button>
        </div>

        <div id="game-over-screen">
            <h1>💀 게임 오버!</h1>
            <h2>똥에 맞았습니다!</h2>
            <p>최종 점수</p>
            <div id="final-score">0</div>
            <button class="restart-btn" id="restart-btn">🔄 다시 하기</button>
        </div>
    </div>

    <audio id="bgm" src="bgm.mp3" loop></audio>
    <audio id="hit-sound" src="jump.mp3"></audio>

    <script>
        // 파티클 효과 캔버스
        const particleCanvas = document.getElementById('particle-canvas');
        const pCtx = particleCanvas.getContext('2d');
        let introParticles = [];
        let introAnimationId;

        function resizeParticleCanvas() {
            particleCanvas.width = window.innerWidth;
            particleCanvas.height = window.innerHeight;
        }
        resizeParticleCanvas();
        window.addEventListener('resize', resizeParticleCanvas);

        // 스파클 파티클 생성
        function createIntroParticles() {
            for (let i = 0; i < 100; i++) {
                introParticles.push({
                    x: Math.random() * particleCanvas.width,
                    y: Math.random() * particleCanvas.height,
                    size: Math.random() * 3 + 1,
                    speedX: (Math.random() - 0.5) * 0.5,
                    speedY: (Math.random() - 0.5) * 0.5,
                    hue: Math.random() * 60 + 280, // 보라~핑크 색상
                    alpha: Math.random(),
                    alphaSpeed: Math.random() * 0.02 + 0.01
                });
            }
        }
        createIntroParticles();

        function animateIntroParticles() {
            pCtx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);

            introParticles.forEach(p => {
                p.x += p.speedX;
                p.y += p.speedY;
                p.alpha += p.alphaSpeed;

                if (p.alpha >= 1 || p.alpha <= 0) p.alphaSpeed *= -1;

                // 화면 밖으로 나가면 반대편에서 재등장
                if (p.x < 0) p.x = particleCanvas.width;
                if (p.x > particleCanvas.width) p.x = 0;
                if (p.y < 0) p.y = particleCanvas.height;
                if (p.y > particleCanvas.height) p.y = 0;

                pCtx.beginPath();
                pCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                pCtx.fillStyle = `hsla(${p.hue}, 100%, 70%, ${p.alpha})`;
                pCtx.shadowBlur = 15;
                pCtx.shadowColor = `hsla(${p.hue}, 100%, 70%, 0.8)`;
                pCtx.fill();
            });

            introAnimationId = requestAnimationFrame(animateIntroParticles);
        }
        animateIntroParticles();

        // 마우스 따라다니는 스파클 효과
        document.getElementById('start-screen').addEventListener('mousemove', (e) => {
            for (let i = 0; i < 3; i++) {
                introParticles.push({
                    x: e.clientX + (Math.random() - 0.5) * 20,
                    y: e.clientY + (Math.random() - 0.5) * 20,
                    size: Math.random() * 4 + 2,
                    speedX: (Math.random() - 0.5) * 3,
                    speedY: (Math.random() - 0.5) * 3,
                    hue: Math.random() * 360,
                    alpha: 1,
                    alphaSpeed: -0.03
                });
            }

            // 최대 파티클 수 제한
            if (introParticles.length > 200) {
                introParticles = introParticles.slice(-150);
            }
        });

        // 게임 캔버스
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const scoreDisplay = document.getElementById('score');
        const highScoreDisplay = document.getElementById('high-score');
        const finalScoreDisplay = document.getElementById('final-score');
        const bgm = document.getElementById('bgm');
        const hitSound = document.getElementById('hit-sound');

        // 게임 상태
        let gameRunning = false;
        let score = 0;
        let highScore = localStorage.getItem('poopGameHighScore') || 0;
        highScoreDisplay.textContent = highScore;

        // 플레이어 설정
        const player = {
            x: canvas.width / 2,
            y: canvas.height - 80,
            width: 50,
            height: 60,
            targetX: canvas.width / 2
        };

        // 떨어지는 물체들
        let fallingObjects = [];
        let spawnInterval = 1000;
        let lastSpawnTime = 0;
        let difficulty = 1;

        // 파티클 효과
        let particles = [];

        // 마우스 이벤트
        canvas.addEventListener('mousemove', (e) => {
            if (!gameRunning) return;
            const rect = canvas.getBoundingClientRect();
            player.targetX = e.clientX - rect.left;
            player.targetX = Math.max(player.width / 2, Math.min(canvas.width - player.width / 2, player.targetX));
        });

        // 게임 시작
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        function startGame() {
            score = 0;
            difficulty = 1;
            fallingObjects = [];
            particles = [];
            player.x = canvas.width / 2;
            player.targetX = canvas.width / 2;
            gameRunning = true;
            startScreen.classList.add('hidden');
            gameOverScreen.style.display = 'none';

            // 인트로 애니메이션 중지
            cancelAnimationFrame(introAnimationId);

            bgm.currentTime = 0;
            bgm.volume = 0.5;
            bgm.play();

            lastSpawnTime = Date.now();
            gameLoop();
        }

        function gameOver() {
            gameRunning = false;
            bgm.pause();
            hitSound.currentTime = 0;
            hitSound.play();

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('poopGameHighScore', highScore);
                highScoreDisplay.textContent = highScore;
            }

            finalScoreDisplay.textContent = score;
            gameOverScreen.style.display = 'block';

            // 폭발 파티클 효과
            for (let i = 0; i < 30; i++) {
                particles.push({
                    x: player.x,
                    y: player.y,
                    vx: (Math.random() - 0.5) * 15,
                    vy: (Math.random() - 0.5) * 15,
                    size: Math.random() * 10 + 5,
                    color: ['#ff6b6b', '#ffd700', '#48dbfb', '#ff9ff3'][Math.floor(Math.random() * 4)],
                    life: 1
                });
            }
        }

        function spawnObject() {
            const isPoop = Math.random() > 0.3;
            const size = isPoop ? 40 + Math.random() * 20 : 30 + Math.random() * 15;

            fallingObjects.push({
                x: Math.random() * (canvas.width - size * 2) + size,
                y: -size,
                size: size,
                speed: 3 + Math.random() * 2 + difficulty * 0.5,
                isPoop: isPoop,
                rotation: 0,
                rotationSpeed: (Math.random() - 0.5) * 0.2
            });
        }

        function drawPlayer() {
            player.x += (player.targetX - player.x) * 0.15;

            ctx.save();
            ctx.translate(player.x, player.y);

            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.beginPath();
            ctx.ellipse(0, 30, 25, 10, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffcc00';
            ctx.beginPath();
            ctx.arc(0, 0, 25, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(-8, -5, 8, 0, Math.PI * 2);
            ctx.arc(8, -5, 8, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = 'black';
            ctx.beginPath();
            ctx.arc(-8, -5, 4, 0, Math.PI * 2);
            ctx.arc(8, -5, 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = 'black';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, 5, 10, 0.2, Math.PI - 0.2);
            ctx.stroke();

            ctx.restore();
        }

        function drawPoop(obj) {
            ctx.save();
            ctx.translate(obj.x, obj.y);
            ctx.rotate(obj.rotation);

            const s = obj.size / 40;

            ctx.fillStyle = '#8B4513';
            ctx.beginPath();
            ctx.ellipse(0, 15 * s, 20 * s, 12 * s, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(0, 0, 16 * s, 10 * s, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(0, -12 * s, 12 * s, 8 * s, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(-5 * s, -18 * s);
            ctx.quadraticCurveTo(0, -35 * s, 5 * s, -18 * s);
            ctx.fill();

            ctx.fillStyle = '#A0522D';
            ctx.beginPath();
            ctx.ellipse(-5 * s, -5 * s, 4 * s, 3 * s, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function drawBall(obj) {
            ctx.save();
            ctx.translate(obj.x, obj.y);
            ctx.rotate(obj.rotation);

            const gradient = ctx.createRadialGradient(-obj.size * 0.3, -obj.size * 0.3, 0, 0, 0, obj.size);
            gradient.addColorStop(0, '#ff6b6b');
            gradient.addColorStop(0.5, '#ee5253');
            gradient.addColorStop(1, '#b33939');

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, obj.size / 2, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.beginPath();
            ctx.arc(-obj.size * 0.2, -obj.size * 0.2, obj.size * 0.15, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function drawParticles() {
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.3;
                p.life -= 0.02;

                if (p.life <= 0) {
                    particles.splice(index, 1);
                    return;
                }

                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            });
        }

        function checkCollision(obj) {
            const dx = player.x - obj.x;
            const dy = player.y - obj.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            const hitRadius = 25 + obj.size / 2 - 10;

            return distance < hitRadius;
        }

        function gameLoop() {
            if (!gameRunning && particles.length === 0) return;

            const bgGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bgGradient.addColorStop(0, '#1a1a2e');
            bgGradient.addColorStop(0.5, '#16213e');
            bgGradient.addColorStop(1, '#0f3460');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < 50; i++) {
                ctx.fillStyle = `rgba(255, 255, 255, ${0.3 + Math.random() * 0.5})`;
                ctx.beginPath();
                ctx.arc(
                    (i * 47) % canvas.width,
                    (i * 31 + Date.now() * 0.01) % canvas.height,
                    1 + Math.random(),
                    0,
                    Math.PI * 2
                );
                ctx.fill();
            }

            if (gameRunning) {
                score++;
                scoreDisplay.textContent = score;

                difficulty = 1 + Math.floor(score / 500) * 0.5;
                spawnInterval = Math.max(400, 1000 - score * 0.5);

                if (Date.now() - lastSpawnTime > spawnInterval) {
                    spawnObject();
                    lastSpawnTime = Date.now();
                }

                fallingObjects.forEach((obj, index) => {
                    obj.y += obj.speed;
                    obj.rotation += obj.rotationSpeed;

                    if (checkCollision(obj)) {
                        gameOver();
                        return;
                    }

                    if (obj.y > canvas.height + obj.size) {
                        fallingObjects.splice(index, 1);
                    }
                });

                fallingObjects.forEach(obj => {
                    if (obj.isPoop) {
                        drawPoop(obj);
                    } else {
                        drawBall(obj);
                    }
                });

                drawPlayer();
            }

            drawParticles();

            requestAnimationFrame(gameLoop);
        }

        const bgGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
        bgGradient.addColorStop(0, '#1a1a2e');
        bgGradient.addColorStop(0.5, '#16213e');
        bgGradient.addColorStop(1, '#0f3460');
        ctx.fillStyle = bgGradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    </script>
