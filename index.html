<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>충효의 게임 월드</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a; /* 어두운 배경색 */
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh; /* 화면 전체 높이 사용 */
            text-align: center;
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 20px;
            color: #00ffcc; /* 네온 민트색 */
            text-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc; /* 네온 빛 효과 */
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 40px;
            color: #cccccc;
        }

        .game-btn {
            background: linear-gradient(45deg, #ff0099, #493240);
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            color: white;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 0, 153, 0.4);
            transition: transform 0.2s;
            text-decoration: none; /* 링크 밑줄 제거 */
            display: inline-block;
        }

        .game-btn:hover {
            transform: scale(1.1); /* 마우스 올리면 커지는 효과 */
            background: linear-gradient(45deg, #ff0099, #ff6600);
        }

        footer {
            margin-top: 50px;
            font-size: 0.8rem;
            opacity: 0.5;
        }
    </style>
</head>
<body>

    <h1>GAME WORLD</h1>
    
    <p>충효님이 만든 웹 게임 세상에 오신 것을 환영합니다!</p>

    <a href="#" class="game-btn" onclick="alert('게임이 준비 중입니다!')">게임 시작하기</a>

    <footer>
        © 2026 Chung-Hyo's Game Studio
    </footer>

</body>
</html>
