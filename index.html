<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>충효님의 카드 뒤집기 게임</title>
    <style>
        body { text-align: center; background-color: #222; color: white; font-family: sans-serif; }
        h1 { margin-top: 30px; }
        #game-board { 
            width: 400px; margin: 0 auto; display: flex; flex-wrap: wrap; 
            justify-content: center; gap: 10px; margin-top: 20px;
        }
        .card {
            width: 80px; height: 120px; background-color: #ffcc00; border-radius: 10px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 40px; color: transparent; font-weight: bold;
            transition: transform 0.3s;
        }
        .card.flipped { background-color: white; color: black; transform: rotateY(180deg); }
        .card.matched { background-color: #66ccff; color: white; cursor: default; }
        #start-btn {
            padding: 15px 30px; font-size: 20px; background-color: #ff4444; color: white;
            border: none; border-radius: 10px; cursor: pointer; margin-top: 20px;
        }
        #start-btn:hover { background-color: #ff0000; }
    </style>
</head>
<body>

    <h1>🎴 충효의 메모리 게임 🎴</h1>
    <p>배경음악과 함께 카드를 맞춰보세요!</p>
    
    <button id="start-btn" onclick="startGame()">게임 시작 (음악 큐!)</button>
    <div id="game-board"></div>

    <script>
        // 1. 음악 설정 (충효님의 구글 드라이브 파일)
        var bgm = new Audio('https://docs.google.com/uc?export=download&id=1naFb5lx7Jd9eplut8muHYoNx_qvQVUIR');
        bgm.loop = true; 
        bgm.volume = 0.5;

        // 2. 게임 데이터
        const emojis = ['🍎', '🍎', '🍌', '🍌', '🍇', '🍇', '🍉', '🍉', '🍓', '🍓', '🍒', '🍒'];
        let shuffledEmojis = [];
        let flippedCards = [];
        let matchedCount = 0;

        function startGame() {
            // 음악 재생 (브라우저 정책 때문에 버튼 눌렀을 때 시작)
            bgm.play().catch(e => console.log("음악 재생 실패"));
            document.getElementById('start-btn').style.display = 'none'; // 버튼 숨기기
            
            // 게임판 초기화
            const board = document.getElementById('game-board');
            board.innerHTML = '';
            shuffledEmojis = emojis.sort(() => 0.5 - Math.random()); // 카드 섞기
            matchedCount = 0;

            // 카드 만들기
            shuffledEmojis.forEach((emoji, index) => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.index = index;
                card.dataset.emoji = emoji;
                card.onclick = () => flipCard(card);
                board.appendChild(card);
            });
        }

        function flipCard(card) {
            if (flippedCards.length < 2 && !card.classList.contains('flipped')) {
                card.classList.add('flipped');
                card.innerText = card.dataset.emoji; // 이모지 보여주기
                flippedCards.push(card);

                if (flippedCards.length === 2) {
                    checkMatch();
                }
            }
        }

        function checkMatch() {
            const [card1, card2] = flippedCards;
            if (card1.dataset.emoji === card2.dataset.emoji) {
                // 맞췄을 때
                card1.classList.add('matched');
                card2.classList.add('matched');
                flippedCards = [];
                matchedCount += 2;
                if (matchedCount === emojis.length) {
                    setTimeout(() => alert("🎉 축하합니다! 모든 카드를 다 맞췄습니다!"), 500);
                }
            } else {
                // 틀렸을 때 (1초 뒤 다시 뒤집기)
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card1.innerText = '';
                    card2.classList.remove('flipped');
                    card2.innerText = '';
                    flippedCards = [];
                }, 1000);
            }
        }
    </script>
</body>
</html>
